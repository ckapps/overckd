@for (group of preparationGroups(); track $index) {
  <div class="mb-2">
    @if (group.label) {
      <h5>{{ group.label }}</h5>
    }
    @if (!group.stepsEnumerated) {
      <div class="text-justify">
        @for (step of group.steps; track $index) {
          <overckd-preparation-step [step]="step" />
        }
      </div>
    } @else {
      <ol [start]="group.start">
        @for (step of group.steps; track $index) {
          <overckd-preparation-step [step]="step" stepsEnumerated />
        }
      </ol>
    }
  </div>
}
