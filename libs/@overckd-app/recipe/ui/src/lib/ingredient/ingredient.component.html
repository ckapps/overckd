@let _ingredient = scaled();
<span>
  @if (_ingredient.optional) {
    <span> optional: </span>
  }
  @if (amount(); as _amount) {
    <span class="font-weight-bold">
      {{ _amount | ingredientAmount }}
    </span>
  }
  @if (unit(); as _unit) {
    <span> {{ _unit }} </span>
  }

  <span [innerHTML]="_ingredient.name"></span>
</span>

@if (alternatives(); as _alternatives) {
  <br />
  (alternativ: {{ _alternatives }})
}
