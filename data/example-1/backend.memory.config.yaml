# Config of apps/backend, passed with `--config`. Flags and environment
# variables (`OVERCKD_SERVER_PORT`, …) override it; left-out keys take their
# defaults. See docs/architecture/configuration.md.
server:
  port: 3000
  apiVersion: legacy
repositories:
  type: memory
  recipes:
    seed:
      files: ./app/recipes/*.recipe.yaml
  collections:
    seed:
      files: ./app/overckd.collections.yaml
media:
  type: filesystem
  dir: ./app/images
  origin: http://localhost:3000
  path: /images
