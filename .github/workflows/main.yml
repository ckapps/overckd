name: CI

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22']

    name: Node ${{ matrix.node }} build

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: true
      - run: pnpx nx run-many -t build
      - run: pnpx nx run-many -t lint
