name: CI

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

jobs:
  build:
    runs-on: ubuntu-latest
    name: Node LTS build

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.0.0
        with:
          install: true
          runtime: node@lts
      - run: pnpx nx run-many -t build
      - run: pnpx nx run-many -t lint
