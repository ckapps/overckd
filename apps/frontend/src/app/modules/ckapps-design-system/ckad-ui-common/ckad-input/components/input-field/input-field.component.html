<mat-form-field>
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [type]="type()"
    [(ngModel)]="value"
    [placeholder]="placeholder() ?? ''"
  />

  @if (clearable() && value) {
  <button
    mat-button
    matSuffix
    mat-icon-button
    aria-label="Clear"
    (click)="value = ''"
  >
    <!-- <mat-icon>clear</mat-icon> -->
  </button>
  }
</mat-form-field>
