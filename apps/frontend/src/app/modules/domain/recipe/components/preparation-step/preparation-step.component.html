@let s = step(); @if (stepsEnumerated()) { @switch(s.format) { @case('text') {
<li class="mb-1">
  {{ s.text }}
</li>
} @case('html') {
<li class="mb-1" [innerHTML]="s.text"></li>
} } } @else { @switch(s.format) { @case('text') {
<p>
  {{ s.text }}
</p>
} @case('html') {
<div [innerHTML]="s.text"></div>
} } }
