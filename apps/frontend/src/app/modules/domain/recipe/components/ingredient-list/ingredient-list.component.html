@for (group of ingredientGroups(); track $index) {
  <div>
    <overckd-ingredient-group [label]="group.label">
      <overckd-ingredient-list
        [ingredients]="group.ingredients"
        [amountScale]="amountScale()"
      />
    </overckd-ingredient-group>
  </div>
}

<ul>
  @for (ingredient of ingredientList(); track $index) {
    <overckd-ingredient
      [ingredient]="ingredient"
      [amountScale]="amountScale()"
    />
  }
</ul>
