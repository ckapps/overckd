@switch (source().kind) {
  @case ('quantity') {
    <div class="portion-converter portion-converter--quantity">
      <label class="portion-converter__label">
        {{ 'For' }}
        <input
          type="number"
          min="1"
          [(ngModel)]="amount"
          class="form-control portion-converter__input"
        />

        @if (label(); as label) {
          <span class="portion-converter__additional-label">
            {{ label }}
          </span>
        }
      </label>
    </div>
  }
  @case ('springform') {
    <div>
      {{ amount() }}
    </div>
  }
}
