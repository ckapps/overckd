<fieldset [formGroup]="form">
  <mat-form-field>
    <mat-label>Kind</mat-label>
    <mat-select formControlName="kind">
      @for (kind of kinds$ | async; track kind) {
      <mat-option [value]="kind">
        <span>{{ kind | portionKind }}</span>
      </mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if ( kind === PortionKind.Quantity || kind === PortionKind.Label ) {

  <mat-form-field>
    <mat-label>Quantity</mat-label>
    <input
      matInput
      formControlName="quantity"
      type="number"
      placeholder="Ex. 12"
      min="0"
    />
    <!-- <span matSuffix>px</span> -->
    <!-- <mat-error *ngIf="fontSizeControl.invalid">Min size: 10px</mat-error> -->
  </mat-form-field>

  <mat-form-field>
    <mat-label>Label</mat-label>
    <input
      matInput
      formControlName="label"
      type="text"
      placeholder="Portion"
      min="0"
    />
    <!-- <span matSuffix>px</span> -->
    <!-- <mat-error *ngIf="fontSizeControl.invalid">Min size: 10px</mat-error> -->
  </mat-form-field>

  }
</fieldset>
